[project]
name = "hekb"
version = "1.0.1"
description = "HEKB: a storage-ignorant, category-theoretic knowledge substrate for the HEXT ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Gemmina Intelligence LLC." },
]
keywords = ["category-theory", "knowledge-graph", "knowledge-representation", "hext", "hekb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gemminai/hekb"
Repository = "https://github.com/gemminai/hekb"
Issues = "https://github.com/gemminai/hekb/issues"
Changelog = "https://github.com/gemminai/hekb/blob/main/CHANGELOG.md"

[project.scripts]
hekb = "hekb:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["hekb"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["hekb"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "--cov=hekb --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hekb"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
